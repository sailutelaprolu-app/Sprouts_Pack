{% extends "layout.html" %}
{% block content %}
<section class="card narrow center">
  <div class="big-ico">🔑</div>
  <h2>{{ t('secret_for', who=who) }}</h2>
  <div class="secret-box" id="secretBox">{{ secret }}</div>
  <button class="btn" type="button" data-copy="{{ secret }}">{{ t('copy') }}</button>
  <p class="warn">{{ t('secret_once') }}</p>
  <a class="btn ghost full" href="{{ back }}">{{ t('done') }}</a>
</section>
{% endblock %}
