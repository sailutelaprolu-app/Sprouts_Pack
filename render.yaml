services:
  - type: web
    name: your-sprouts
    runtime: python
    plan: free
    region: singapore
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: ADMIN_SECRET
        sync: false
      - key: DATABASE_URL
        sync: false
